[package]
name = "sdr-hal-limesuite"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors.workspace = true
description = "Safe Rust bindings to the LimeSuite library for LimeSDR devices"
readme = "README.md"
repository = "https://github.com/chrismoos/sdr-hal"
keywords = ["sdr", "limesdr", "limesuite", "radio"]
categories = ["api-bindings", "hardware-support"]

[lib]
name = "limesuite"

[dependencies]
limesuite-sys = { package = "sdr-hal-limesuite-sys", version = "0.1.0", path = "../limesuite-sys" }
num-complex = "0.4"
thiserror = "1"
log = "0.4"

[lints]
workspace = true
